<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tramastudio</title>
<meta name="description" content="tramastudio — producción, estilismo, redes sociales y branding. Estudio creativo en Buenos Aires.">
<meta property="og:title" content="tramastudio">
<meta property="og:description" content="Hagamos crecer tu marca. Producción, estilismo, redes sociales y branding.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;800&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#000000}
.works::-webkit-scrollbar{height:4px}.works::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.4)}
a{color:#FFCAD0}a:hover{color:#FEFFFA}
button:focus-visible,a:focus-visible{outline:2px solid #FFCAD0;outline-offset:-6px}

.wk .slot{opacity:0;transition:transform .95s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
.wk.on .slot{opacity:1}
.wk .ball{opacity:0}
.wk.on .ball{animation:ball 1.75s linear forwards}
@keyframes ball{0%{opacity:1;transform:translateY(-360px);animation-timing-function:cubic-bezier(.5,0,1,.6)}32%{opacity:1;transform:translateY(0) scale(1.2,.8);animation-timing-function:cubic-bezier(0,.4,.5,1)}50%{opacity:1;transform:translateY(-120px) scale(1);animation-timing-function:cubic-bezier(.5,0,1,.6)}66%{opacity:1;transform:translateY(0) scale(1.14,.86);animation-timing-function:cubic-bezier(0,.4,.5,1)}76%{opacity:1;transform:translateY(-36px) scale(1);animation-timing-function:cubic-bezier(.5,0,1,.6)}86%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(0) scale(14,1.6)}}
.wk .word{opacity:0;clip-path:inset(0 50% 0 50%);transition:clip-path .9s cubic-bezier(.2,.8,.2,1) 1.5s,opacity .15s linear 1.5s}
.wk.on .word{opacity:1;clip-path:inset(-10% -6% -24% -6%)}
.tile{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.tile:hover,.tile:focus-visible{transform:perspective(700px) translateY(-10px) rotateX(7deg) scale(1.08);box-shadow:0 22px 30px rgba(0,0,0,.35)}
.slot:hover,.slot:focus-within{z-index:5}
.nm{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.tile:hover .nm,.tile:focus-visible .nm{opacity:1;transform:none}
@media (hover:none){.nm{opacity:1;transform:none}}
@keyframes pin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.pin{animation:pin .7s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.wk .ball{display:none}.wk .slot,.wk .word,.tile,.nm{transition:none!important}.pin{animation:none}}
.wk .rt .slot:nth-child(1){transform:translate(210%,140%) scale(.12) rotate(-30deg)}
.wk.on .rt .slot:nth-child(1){transform:translateY(10px) rotate(-5deg);transition-delay:2.15s}
.wk .rt .slot:nth-child(2){transform:translate(105%,140%) scale(.12) rotate(18deg)}
.wk.on .rt .slot:nth-child(2){transform:translateY(-6px) rotate(3deg);transition-delay:2.24s}
.wk .rt .slot:nth-child(3){transform:translate(0%,140%) scale(.12) rotate(-12deg)}
.wk.on .rt .slot:nth-child(3){transform:translateY(4px) rotate(-2deg);transition-delay:2.33s}
.wk .rt .slot:nth-child(4){transform:translate(-105%,140%) scale(.12) rotate(24deg)}
.wk.on .rt .slot:nth-child(4){transform:translateY(-10px) rotate(4deg);transition-delay:2.42s}
.wk .rt .slot:nth-child(5){transform:translate(-210%,140%) scale(.12) rotate(-24deg)}
.wk.on .rt .slot:nth-child(5){transform:translateY(8px) rotate(-4deg);transition-delay:2.51s}
.wk .rb .slot:nth-child(1){transform:translate(210%,-140%) scale(.12) rotate(24deg)}
.wk.on .rb .slot:nth-child(1){transform:translateY(-8px) rotate(4deg);transition-delay:2.60s}
.wk .rb .slot:nth-child(2){transform:translate(105%,-140%) scale(.12) rotate(-18deg)}
.wk.on .rb .slot:nth-child(2){transform:translateY(6px) rotate(-3deg);transition-delay:2.69s}
.wk .rb .slot:nth-child(3){transform:translate(0%,-140%) scale(.12) rotate(12deg)}
.wk.on .rb .slot:nth-child(3){transform:translateY(-4px) rotate(2deg);transition-delay:2.78s}
.wk .rb .slot:nth-child(4){transform:translate(-105%,-140%) scale(.12) rotate(-30deg)}
.wk.on .rb .slot:nth-child(4){transform:translateY(10px) rotate(-5deg);transition-delay:2.87s}
.wk .rb .slot:nth-child(5){transform:translate(-210%,-140%) scale(.12) rotate(18deg)}
.wk.on .rb .slot:nth-child(5){transform:translateY(-6px) rotate(3deg);transition-delay:2.96s}
@keyframes rv{from{opacity:0;transform:perspective(900px) translateY(64px) rotateX(18deg)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 24%}
}
}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl"><div style="background: #000000; color: #FEFFFA; font-family: 'Raleway', system-ui, sans-serif; font-size: 17px; line-height: 1.55">
<div style="position: relative; height: min(100vh, 900px); min-height: 480px; overflow: hidden; background: #FEFFFA">

<div id="trama-stage" ref="{{ setStage }}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #FEFFFA">
<canvas id="trama-bg" ref="{{ setBg }}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"></canvas>
<canvas id="trama-fg" ref="{{ setFg }}" role="img" aria-label="tramastudio" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"></canvas>
</div>

<img id="trama-logo" ref="{{ setLogo }}" src="assets/logo-letters.png" alt="" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none">

<button type="button" onClick="{{ tap }}" onPointerMove="{{ move }}" onPointerLeave="{{ leave }}" aria-label="Tocar para tejer la entrada" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 0; border: none; background: transparent; cursor: pointer; touch-action: pan-y; display: flex; align-items: center; justify-content: center">
<span style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 3.2vw, 36px); letter-spacing: 0.04em; color: #000000; transition: opacity 0.35s ease; opacity: {{clickOpacity}}">click</span>
</button>

<button type="button" onClick="{{ toggleSound }}" aria-label="{{ soundLabel }}" style="position: absolute; right: 12px; bottom: 12px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; color: #FEFFFA; mix-blend-mode: difference; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ soundOff }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 H6.5 L11 5 V17 L6.5 13.5 H3 Z"></path><path d="M14.5 8.5 L19 13.5 M19 8.5 L14.5 13.5"></path></svg>
</sc-if>
<sc-if value="{{ soundOn }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 H6.5 L11 5 V17 L6.5 13.5 H3 Z"></path><path d="M14.5 8 C16 9.5 16 12.5 14.5 14 M17 6 C20 8.5 20 13.5 17 16"></path></svg>
</sc-if>
</button>

<div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; pointer-events: none">
<a href="#our-job" aria-hidden="{{ cueHidden }}" tabIndex="{{ cueTab }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 30px; border: 1px solid #FFCAD0; border-radius: 999px; background: #000000; color: #FFCAD0; text-decoration: none; font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 20px; transition: opacity 0.6s ease 0.9s, transform 0.6s ease 0.9s; opacity: {{cueOpacity}}; transform: translateY({{cueShift}}px); pointer-events: {{cuePointer}}">Conoce nuestro universo</a>
</div>

</div>

<section id="our-job" aria-label="Servicios" style="border-top: 1px solid rgba(254,255,250,0.12)">
<div id="trama-job" style="position: relative; height: min(100vh, 880px); min-height: 560px; overflow: hidden; background: #000000">
<div style="position: absolute; left: 0; top: 0; width: 1000px; height: 5460px; transform-origin: 0 0; will-change: transform; transition: transform 1.9s cubic-bezier(0.6, 0, 0.2, 1), opacity 1.1s ease 0.5s; transform: {{camTf}}; opacity: {{w1o}}">
<svg aria-hidden="true" width="1000" height="5460" style="position: absolute; left: 0; top: 0; width: 1000px; height: 5460px; overflow: visible">
<path d="M 500 330 C 500 420, 560 430, 560 520 C 578 800, 546 1200, 560 1480 C 565 1600, 900 1560, 880 1660 C 860 1760, 440 1690, 440 1810 C 422 2100, 456 2450, 440 2730 C 435 2850, 100 2810, 120 2910 C 140 3010, 560 2940, 560 3060 C 578 3350, 546 3700, 560 3980 C 565 4100, 900 4060, 880 4160 C 860 4260, 440 4190, 440 4310 C 422 4600, 456 4950, 440 5230 C 440 5330, 500 5340, 500 5420" style="fill: none; stroke: #FFCAD0; stroke-width: 2.6px; stroke-linecap: round; stroke-dasharray: 6794; stroke-dashoffset: {{dash}}; transition: stroke-dashoffset {{dashDur}}s cubic-bezier(0.5, 0, 0.3, 1)"></path>
</svg>
<h2 aria-label="Hagamos crecer tu marca" style="position: absolute; left: 0; top: 70px; width: 1000px; margin: 0; text-align: center; font-size: 96px; line-height: 1.08; font-weight: 800; color: #FEFFFA"><span style="display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.12em 0.18em 0; margin: 0 0.08em -0.18em 0"><span style="display: inline-block; font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; transform-origin: 0% 100%; transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.0s, opacity 0.8s ease 0.0s; transform: translateY({{jobY}}) rotate({{jobR}}); opacity: {{jobO}}">Hagamos</span></span> <span style="display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.12em 0.18em 0; margin: 0 0.08em -0.18em 0"><span style="display: inline-block; font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; transform-origin: 0% 100%; transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s, opacity 0.8s ease 0.1s; transform: translateY({{jobY}}) rotate({{jobR}}); opacity: {{jobO}}">crecer</span></span><br><span style="display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.12em 0.18em 0; margin: 0 0.08em -0.18em 0"><span style="display: inline-block; font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; transform-origin: 0% 100%; transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s, opacity 0.8s ease 0.2s; transform: translateY({{jobY}}) rotate({{jobR}}); opacity: {{jobO}}">tu</span></span> <span style="display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.12em 0.18em 0; margin: 0 0.08em -0.18em 0"><span style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-style: italic; font-weight: 400; color: #FFCAD0; font-size: 1.22em; transform-origin: 0% 100%; transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s, opacity 0.8s ease 0.3s; transform: translateY({{jobY}}) rotate({{jobR}}); opacity: {{jobO}}">marca</span></span></h2>
<div style="position: absolute; left: 60px; top: 560px; width: 440px; display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 30px; line-height: 1; color: #FEFFFA; transition: opacity 0.9s ease 1.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.0s; opacity: {{s1o}}; transform: translateY({{s1y}}px)">01</div>
<h3 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0; transition: opacity 0.9s ease 1.25s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s; opacity: {{s1o}}; transform: translateY({{s1y}}px)">producción</h3>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500; transition: opacity 0.9s ease 1.6s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s; opacity: {{s1o}}; transform: translateY({{s1y}}px)">Creamos contenido visual que transmite la esencia y personalidad de cada marca. Desarrollamos producciones pensadas para comunicar, destacar productos y construir una imagen estética, coherente y diferencial.</p>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 300; transition: opacity 0.9s ease 2.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.0s; opacity: {{s1o}}; transform: translateY({{s1y}}px)">Realizamos producciones editoriales, e-commerce, lookbooks y fotografía de producto, acompañando cada etapa del proceso creativo. Desde la conceptualización, el desarrollo de moodboards y la planificación de sets, hasta la dirección artística, coordinación de equipos y realización de la producción.</p>
</div>
<div style="position: absolute; left: 500px; top: 1850px; width: 440px; display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 30px; line-height: 1; color: #FEFFFA; transition: opacity 0.9s ease 1.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.0s; opacity: {{s2o}}; transform: translateY({{s2y}}px)">02</div>
<h3 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0; transition: opacity 0.9s ease 1.25s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s; opacity: {{s2o}}; transform: translateY({{s2y}}px)">estilismo</h3>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500; transition: opacity 0.9s ease 1.6s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s; opacity: {{s2o}}; transform: translateY({{s2y}}px)">Entendemos el estilismo como una herramienta de comunicación visual. A través de la selección de prendas, accesorios, texturas y composiciones, construimos propuestas que potencian la identidad de cada marca y generan una narrativa estética propia.</p>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 300; transition: opacity 0.9s ease 2.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.0s; opacity: {{s2o}}; transform: translateY({{s2y}}px)">Desarrollamos propuestas de estilismo para campañas, editoriales, lookbooks y producciones comerciales, trabajando en la curaduría de prendas, armado de looks, selección de accesorios y definición de conceptos visuales. Cada elección está pensada para destacar el producto y transmitir un mensaje.</p>
</div>
<div style="position: absolute; left: 60px; top: 3100px; width: 440px; display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 30px; line-height: 1; color: #FEFFFA; transition: opacity 0.9s ease 1.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.0s; opacity: {{s3o}}; transform: translateY({{s3y}}px)">03</div>
<h3 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0; transition: opacity 0.9s ease 1.25s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s; opacity: {{s3o}}; transform: translateY({{s3y}}px)">redes sociales</h3>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500; transition: opacity 0.9s ease 1.6s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s; opacity: {{s3o}}; transform: translateY({{s3y}}px)">Construimos la presencia digital de cada marca desde una mirada estratégica, creativa y estética. Buscamos generar una comunicación auténtica, fortalecer su identidad, conectar con su audiencia y desarrollar una comunidad que crezca de manera orgánica y sostenida.</p>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 300; transition: opacity 0.9s ease 2.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.0s; opacity: {{s3o}}; transform: translateY({{s3y}}px)">Nuestro servicio integra Social Media Management, Community Management, gestión de pauta publicitaria y creación de contenido orgánico. Trabajamos en la planificación estratégica, dirección creativa, diseño de contenido, copywriting, programación de publicaciones, interacción con la comunidad y análisis de resultados, adaptando cada propuesta a las necesidades y objetivos de la marca.</p>
</div>
<div style="position: absolute; left: 500px; top: 4350px; width: 440px; display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 30px; line-height: 1; color: #FEFFFA; transition: opacity 0.9s ease 1.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.0s; opacity: {{s4o}}; transform: translateY({{s4y}}px)">04</div>
<h3 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0; transition: opacity 0.9s ease 1.25s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s; opacity: {{s4o}}; transform: translateY({{s4y}}px)">branding</h3>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500; transition: opacity 0.9s ease 1.6s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s; opacity: {{s4o}}; transform: translateY({{s4y}}px)">Creamos identidades visuales que cuentan historias y construyen marcas con personalidad. Partimos de su esencia, valores y propósito para desarrollar un universo visual auténtico, reconocible y coherente en cada punto de contacto.</p>
<p style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 300; transition: opacity 0.9s ease 2.0s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.0s; opacity: {{s4o}}; transform: translateY({{s4y}}px)">Acompañamos el proceso desde la conceptualización y estrategia de marca hasta el desarrollo de su identidad visual. Trabajamos en la creación de logotipos, selección tipográfica, paleta cromática, recursos gráficos, dirección estética y manual de marca, construyendo un sistema visual que permita comunicar con claridad y diferenciarse.</p>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1000px; height: 1400px; transform-origin: 0 0; transition: transform 1.9s cubic-bezier(0.6, 0, 0.2, 1), opacity 1s ease 0.6s; transform: {{ovTf}}; opacity: {{w2o}}; pointer-events: {{w2p}}">
<svg aria-hidden="true" width="1000" height="1400" style="position: absolute; left: 0; top: 0; width: 1000px; height: 1400px; overflow: visible">
<path d="M 500 220 C 500 300, 300 290, 280 380 C 262 470, 250 520, 300 560 C 420 640, 660 560, 720 680 C 760 760, 740 840, 660 870 C 520 920, 320 860, 280 980 C 262 1070, 300 1130, 380 1150 C 540 1190, 700 1140, 720 1260 C 732 1320, 722 1360, 720 1390" style="fill: none; stroke: #FFCAD0; stroke-width: 3.6px; stroke-linecap: round; stroke-dasharray: 2311; stroke-dashoffset: {{dash2}}; transition: stroke-dashoffset {{dash2Dur}}s cubic-bezier(0.5, 0, 0.3, 1) 0.7s"></path>
</svg>
<p aria-hidden="true" style="position: absolute; left: 0; top: 50px; width: 1000px; margin: 0; text-align: center; font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; font-size: 62px; line-height: 1.1; letter-spacing: -0.02em; color: #FEFFFA">Hagamos crecer tu <span style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-weight: 400; font-size: 1.22em; letter-spacing: 0; color: #FFCAD0">marca</span></p>
<button type="button" onClick="{{ go1 }}" style="position: absolute; left: 340px; top: 385px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 0; border: none; background: transparent; cursor: pointer; color: #FEFFFA; text-align: left; transition: opacity 0.8s ease 1.25s, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s; opacity: {{w2o}}; transform: translateY({{w2y}}px)">
<span style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 34px; line-height: 1">01</span>
<span style="font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0">producción</span>
</button>
<button type="button" onClick="{{ go2 }}" style="position: absolute; right: 340px; top: 640px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 12px 0; border: none; background: transparent; cursor: pointer; color: #FEFFFA; text-align: right; transition: opacity 0.8s ease 1.60s, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.60s; opacity: {{w2o}}; transform: translateY({{w2y}}px)">
<span style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 34px; line-height: 1">02</span>
<span style="font-family: 'Raleway', system-ui, sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.01em; color: #FFCAD0">estilismo</span>
</button>
<button type="button" onClick="{{ go3 }}" style="position: absolute; left: 340px; top: 985px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 0; border: none; background: transparent; cursor: pointer; color: #FEFFFA; text-align: left; transition: opacity 0.8s ease 1.95s, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.95s; opacity: {{w2o}}; transform: translateY({{w2y}}px)">
<span style="font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 34px; line-height: 1">03</span>

shrink(f) {
return new Promise((res) => {
let url;
try { url = URL.createObjectURL(f); } catch (err) { res(null); return; }
const img = new Image();
img.onload = () => {
const M = 2200;
const w = img.naturalWidth, h = img.naturalHeight;
const k = Math.min(1, M / Math.max(w, h));
const c = document.createElement('canvas');
c.width = Math.max(1, Math.round(w * k));
c.height = Math.max(1, Math.round(h * k));
c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
URL.revokeObjectURL(url);
c.toBlob((b) => res(b), 'image/jpeg', 0.86);
};
img.onerror = () => { URL.revokeObjectURL(url); res(null); };
img.src = url;
});
}

fr.readAsDataURL(blob);
});
}

if (!this.token()) { this.setState({ askToken: true }); return; }
this.uploadAll(files, op).then(() => { try { input.value = ''; } catch (err) {} });

async uploadAll(files, op) {
let ok = 0;
const fails = [];
for (let i = 0; i < files.length; i++) {
const f = files[i];
this.setState({ saveMsg: 'Subiendo ' + (i + 1) + ' de ' + files.length + '…' });
try {
const isVid = (f.type || '').indexOf('video') === 0;
const ext0 = ((f.name || '').split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
let blob = f;
let ext = ext0 || (isVid ? 'mp4' : 'jpg');
if (!isVid) {
const small = await this.shrink(f);
if (small) { blob = small; ext = 'jpg'; }
}
if (blob.size > 95 * 1024 * 1024) { fails.push((f.name || 'archivo') + ' (pesa más de 95 MB)'); continue; }
const path = 'media/trabajo-' + (op + 1) + '/' + Date.now() + '-' + i + '.' + ext;
const content = await this.blobB64(blob);
await this.gh('PUT', path, { message: 'Subir archivo a trabajo ' + (op + 1), content: content, branch: 'main' });
const d = this.cloneData();
d[op].media.push({ t: isVid ? 'vid' : 'img', u: path, src: URL.createObjectURL(blob) });
this.setState({ data: d });
ok++;
} catch (err) {
fails.push((f.name || 'archivo') + (err && err.status === 401 ? ' (clave inválida)' : ''));
}
}
if (ok) this.queueSave();
if (fails.length) this.setState({ saveMsg: (ok ? 'Se subieron ' + ok + '. ' : '') + 'No se pudo subir: ' + fails.join(', ') + '.' });
}

f.clearRect(0, 0, this.fg.width, this.fg.height);
f.save();
f.beginPath();
f.rect(0, B.y - 4 * dpr, this.fg.width, B.h + 4 * dpr);
f.clip();
for (let i = 0; i < n; i++) {
const L = this.letters[i];
const q = Math.min(1, Math.max(0, (t - LINE * 0.6 - STAG * i) / RISE));
if (q <= 0) continue;
const pe = q >= 1 ? 1 : 1 - Math.pow(2, -10 * q);
f.drawImage(L.c, L.dx, L.dy + (1 - pe) * B.h * 1.05);
}
f.restore();
const yb = B.y + B.h + 2 * dpr;
const cxl = B.x + B.w / 2;
const grow = this.ease(t / LINE);
const out = this.ease((t - landed + 120 * k) / (340 * k));
if (out < 1) {
const x0 = cxl - (B.w / 2) * grow + B.w * grow * out;
const x1 = cxl + (B.w / 2) * grow;
f.fillStyle = '#FEFFFA';
f.fillRect(x0, yb, Math.max(0, x1 - x0), Math.max(1, Math.round(dpr)));
}
if (t >= landed + 260 * k) {
this.phase = 'done';
this.doneAt = now;
this.setState({ done: true });
try { window.localStorage.setItem('trama_intro_seen', '1'); } catch (err) {}
}
}
}
this.raf = requestAnimationFrame(this.frame);
};

renderVals() {
const st = this.state || {};
const step = typeof st.step === 'number' ? st.step : -1;
const OFFS = [6794, 5631, 4743, 3823, 2934, 2014, 1125, 0, 0];
const DUR = [0.01, 5.6, 2.6, 4.6, 2.6, 4.6, 2.6, 4.8, 0.01];
const RECTS = [[60, 40, 880, 440], [30, 490, 570, 1010], [40, 1330, 920, 640], [400, 1780, 570, 1010], [40, 2580, 920, 640], [30, 3030, 570, 1010], [40, 3830, 920, 640], [400, 4280, 570, 1010], [0, 0, 1000, 5460]];
const vw = st.vw || 1000, vh = st.vh || 880;
const R = RECTS[Math.max(0, step)];
const availH = vh - (step >= 1 ? 64 : 0);
const sc = Math.min(vw / R[2], availH / R[3]);
const cxw = vw / sc >= 1000 ? 500 : R[0] + R[2] / 2;
const camTf = 'translate(' + (vw / 2 - cxw * sc).toFixed(1) + 'px, ' + (availH / 2 - (R[1] + R[3] / 2) * sc).toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';
const data = st.data || this.defaults();
const op = typeof st.open === 'number' ? st.open : -1;
const editing = !!st.edit && op >= 0;
const P = op >= 0 ? data[op] : null;
const label = (i) => (data[i] && data[i].name) || '[Proyecto ' + (i < 9 ? '0' : '') + (i + 1) + ']';
const coverOf = (p) => {
const c = p.media[p.ci];
if (c && c.t === 'img' && c.src) return c.src;
for (let j = 0; j < p.media.length; j++) { if (p.media[j].t === 'img' && p.media[j].src) return p.media[j].src; }
return '';
};
const tv = {};
const tiles = data.map((p, i) => {
const c = coverOf(p);
return {
name: label(i), src: c, has: !!c, no: !c,
num: (i < 9 ? '0' : '') + (i + 1),
bg: i % 2 === 0 ? '#000000' : '#FEFFFA',
fg: i % 2 === 0 ? '#FEFFFA' : '#000000',
open: () => this.openWork(i)
};
});
const tileRows = [];
for (let i = 5; i < tiles.length; i += 5) tileRows.push({ items: tiles.slice(i, i + 5) });
tv.topTiles = tiles.slice(0, 5);
tv.tileRows = tileRows;
tv.canAdd = this.canEdit() && !!this.token();
tv.canDel = !!st.edit && op >= 10;
tv.addWork = this.addWork;
tv.delWork = this.delWork;
const media = P ? P.media.map((m, j) => ({
src: m.src || m.u || '',
isImg: m.t === 'img' && !!(m.src || m.u),
isVid: m.t === 'vid' && !!(m.src || m.u),
ed: editing,
alt: label(op) + ', foto ' + (j + 1),
coverTxt: j === P.ci ? 'Es la portada' : 'Usar de portada',
remove: () => this.removeMedia(j),
cover: () => this.patch({ ci: j })
})) : [];
const ovS = Math.min(vw / 1000, availH / 1400) * (step === 8 ? 1 : 1.3);
const ovTf = 'translate(' + (vw / 2 - 500 * ovS).toFixed(1) + 'px, ' + (availH / 2 - 700 * ovS).toFixed(1) + 'px) scale(' + ovS.toFixed(4) + ')';
return Object.assign(tv, {
ovTf: ovTf,
w1o: step === 8 ? 0 : 1,
w2o: step === 8 ? 1 : 0,
w2y: step === 8 ? 0 : 30,
w2p: step === 8 ? 'auto' : 'none',
dash2: step === 8 ? 0 : 2311,
dash2Dur: step === 8 ? 2.6 : 0.01,
go5: this.go5,
b5c: step === 8 ? '#FFCAD0' : '#FEFFFA', b5u: step === 8 ? 'underline' : 'none',
tap: this.tap,
move: this.move,
leave: this.leave,
toggleSound: this.toggleSound,
clickOpacity: st.started ? 0 : 1,
wkOn: st.wIn ? 'on' : '',
pOpen: op >= 0,
editing: editing,
viewing: !editing,
pEmpty: !editing && media.length === 0,
askToken: !!st.askToken && op >= 0,
tokMsg: st.tokMsg || '',
onToken: this.onToken,
logout: this.logout,
editTxt: editing ? 'Listo' : 'Editar',
canEdit: /[?&]edit\b/.test(window.location.search),
saveMsg: st.saveMsg || '',
pName: P ? label(op) : '',
pNameRaw: P ? P.name : '',
pClient: P ? P.client : '',
pService: P ? P.service : '',
pText: P ? P.text : '',
pTeam: P ? P.team : '',
pNum: op >= 0 ? (op < 9 ? '0' : '') + (op + 1) : '',
media: media,
closeP: this.closeP,
toggleEdit: this.toggleEdit,
resetP: this.resetP,
onField: this.onField,
onFiles: this.onFiles,
open0: this.open0,
open1: this.open1,
open2: this.open2,
open3: this.open3,
open4: this.open4,
open5: this.open5,
open6: this.open6,
open7: this.open7,
open8: this.open8,
open9: this.open9,
wDotY: st.wIn ? 0 : -460,
wDotO: st.wIn ? 1 : 0,
wLineS: st.wIn ? 1 : 0,
wClip: st.wIn ? '0%' : '100%',
wTitleX: st.wIn ? 0 : -24,
wThread: st.wIn ? 0 : 3885,
wConn: st.wIn ? 0 : 34,
wCardO: st.wIn ? 1 : 0,
wCardY: st.wIn ? 0 : 40,
jobY: step >= 0 ? '0%' : '115%',
jobR: step >= 0 ? '0deg' : '7deg',
jobO: step >= 0 ? 1 : 0,
camTf: camTf,
dash: OFFS[Math.max(0, step)],
dashDur: st.manual ? 1.9 : DUR[Math.max(0, step)],
navO: step >= 1 ? 1 : 0,
navP: step >= 1 ? 'auto' : 'none',
go1: this.go1, go2: this.go2, go3: this.go3, go4: this.go4,
s1o: step >= 1 ? 1 : 0, s1y: step >= 1 ? 0 : 36,
s2o: step >= 3 ? 1 : 0, s2y: step >= 3 ? 0 : 36,
s3o: step >= 5 ? 1 : 0, s3y: step >= 5 ? 0 : 36,
s4o: step >= 7 ? 1 : 0, s4y: step >= 7 ? 0 : 36,
b1c: step === 1 ? '#FFCAD0' : '#FEFFFA', b1u: step === 1 ? 'underline' : 'none',
b2c: (step === 2 || step === 3) ? '#FFCAD0' : '#FEFFFA', b2u: (step === 2 || step === 3) ? 'underline' : 'none',
b3c: (step === 4 || step === 5) ? '#FFCAD0' : '#FEFFFA', b3u: (step === 4 || step === 5) ? 'underline' : 'none',
b4c: (step === 6 || step === 7) ? '#FFCAD0' : '#FEFFFA', b4u: (step === 6 || step === 7) ? 'underline' : 'none',
funY: st.funIn ? '0%' : '115%',
funR: st.funIn ? '0deg' : '7deg',
funO: st.funIn ? 1 : 0,
cueOpacity: st.done ? 1 : 0,
cueShift: st.done ? 0 : 12,
cuePointer: st.done ? 'auto' : 'none',
cueHidden: st.done ? 'false' : 'true',
cueTab: st.done ? 0 : -1,
soundOn: !!st.sound,
soundOff: !st.sound,
soundLabel: st.sound ? 'Apagar el sonido' : 'Encender el sonido',
setStage: this.setStage,
setBg: this.setBg,
setFg: this.setFg,
setLogo: this.setLogo
});
}
}
preact.render(preact.h(Component), document.getElementById('root'));
</script>
